name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */4 * * *'   # Runs every 4 hours
  workflow_dispatch:        # Allows manual run from Actions tab

jobs:
  wake-up:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Wake up Streamlit apps
        env:
          APP_URLS: |
            https://rough1-22mbdzszf85xrukklkbdgv.streamlit.app/
            https://rough1-f7duxwjxdqgpkbthksczpc.streamlit.app/

        run: |
          cat <<'PY' > keep_awake.py
          import os
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          APP_URLS = [
              url.strip()
              for url in os.getenv("APP_URLS", "").splitlines()
              if url.strip()
          ]

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1920,1080")

          for app_url in APP_URLS:
              driver = webdriver.Chrome(options=options)

              try:
                  print(f"Connecting to: {app_url}")
                  driver.get(app_url)
                  time.sleep(8)

                  buttons = driver.find_elements(
                      By.XPATH,
                      "//button[contains(., 'Yes, get this app back up!') "
                      "or contains(., 'wake up') "
                      "or contains(., 'Get this app back up')]"
                  )

                  if buttons:
                      buttons[0].click()
                      print("Clicked Streamlit wake-up button!")
                      time.sleep(10)
                  else:
                      print("Wake-up button not needed — app is already awake.")

                  # Keep connection open
                  time.sleep(15)

                  print("Page Title:", driver.title)
                  print(f"Successfully checked: {app_url}")

              except Exception as e:
                  print(f"Error with {app_url}: {e}")

              finally:
                  driver.quit()

          print("All Streamlit apps have been checked.")
          PY

          python keep_awake.py
