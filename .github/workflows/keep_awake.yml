name: Keep Streamlit App Awake

# Runs every 4 hours
on:
  schedule:
    - cron: '0 */4 * * *'   # at minute 0 every 4th hour
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository (required for GitHub‑provided environment)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python (required for Selenium & Chrome driver)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Chrome and matching ChromeDriver
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          DRIVER_VERSION=$(wget -qO- "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION")
          wget -q "https://chromedriver.storage.googleapis.com/${DRIVER_VERSION}/chromedriver_linux64.zip"
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

      # Install Python dependencies (Selenium)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium==4.15.2

      # Run the wake‑up script
      - name: Wake up Streamlit app
        env:
          APP_URL: https://rough1-t4eyazzut2qdfj4x2z7yka.streamlit.app/
        run: |
          cat <<'PY' > keep_awake.py
          import os
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          APP_URL = os.getenv('APP_URL')

          options = Options()
          options.add_argument('--headless')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.add_argument('--window-size=1920,1080')

          driver = webdriver.Chrome(service=Service('/usr/local/bin/chromedriver'), options=options)

          try:
              driver.get(APP_URL)
              # Give the page a few seconds to load
              time.sleep(5)

              # Look for the "Yes, get this app back up!" button and click it if present
              try:
                  button = driver.find_element(By.XPATH, "//button[contains(text(),'Yes, get this app back up!')]")
                  button.click()
                  print("Clicked wake‑up button.")
              except Exception:
                  print("Wake‑up button not found – app might already be awake.")

              # Keep the connection alive for ~15 seconds
              time.sleep(15)
          finally:
              driver.quit()
          PY
          python keep_awake.py
