name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */4 * * *'   # Runs every 4 hours
  workflow_dispatch:        # Allows manual run from Actions tab

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Wake up Streamlit app
        env:
          APP_URL: https://rough1-t4eyazzut2qdfj4x2z7yka.streamlit.app/
        run: |
          cat <<'PY' > keep_awake.py
          import os
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          APP_URL = os.getenv('APP_URL')

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.add_argument('--window-size=1920,1080')

          # Selenium automatically finds Chrome and configures ChromeDriver
          driver = webdriver.Chrome(options=options)

          try:
              print(f"Connecting to: {APP_URL}")
              driver.get(APP_URL)
              time.sleep(8)

              # Check if the Streamlit sleep button is present
              try:
                  buttons = driver.find_elements(By.XPATH, "//button[contains(., 'Yes, get this app back up!') or contains(., 'wake up') or contains(., 'Get this app back up')]")
                  if buttons:
                      buttons[0].click()
                      print("Clicked 'Yes, get this app back up!' wake-up button!")
                      time.sleep(10)
                  else:
                      print("Wake-up button not needed — app is already awake.")
              except Exception as e:
                  print(f"Check completed: {e}")

              # Keep connection open so Streamlit registers the WebSocket
              time.sleep(15)
              print("Page Title:", driver.title)
              print("Successfully checked in and kept the app awake.")
          finally:
              driver.quit()
          PY
          python keep_awake.py
