name: Keep Render Service Awake

on:
  schedule:
    - cron: '7,19,31,43,55 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -L --max-time 120 -sS -o /dev/null -w "HTTP status: %{http_code}\n" "https://video-downloader-smu9.onrender.com/"
