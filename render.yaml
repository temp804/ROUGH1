services:
  - type: web
    name: universal-video-downloader
    env: python
    region: singapore  # closest to India
    plan: free
    buildCommand: pip install -r requirements1.txt
    startCommand: python -m streamlit run aaa_final.py --server.port=10000 --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: app-data
      mountPath: /app/data
      sizeGB: 1
